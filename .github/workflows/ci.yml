name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks and unit tests are platform independent, so they run once
  # rather than three times.
  check:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm compat:node22
      - run: pnpm typecheck
      - run: pnpm test
      # The shipped third-party notices are generated from the lockfile. This
      # fails when the two have drifted, which is the only way that file goes
      # quietly wrong.
      - run: pnpm license:check

  # The packaged suite is the only thing that proves the app actually runs, and
  # it has to prove it on every platform Noto ships to.
  e2e:
    name: Packaged e2e (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24.04, not ubuntu-latest: the installers job is pinned for the same
        # reason, and a moving runner image makes an e2e-only failure
        # impossible to attribute to the change under test.
        os: [macos-14, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Fetch Electron's binary explicitly.
      #
      # The copy of electron that pnpm 11 installs has no `scripts` field, so
      # its `postinstall` never runs and `node_modules/electron/dist` is never
      # fetched. `pnpm ignored-builds` reports none and `pnpm rebuild electron`
      # does nothing, because from pnpm's side there is no build to run.
      # Without the binary, packaging fails on `electron/dist/LICENSE` and every
      # packaged test then fails to launch.
      - name: Ensure the Electron binary
        run: node node_modules/electron/install.js

      # Electron needs a display server on Linux. xvfb-run supplies one.
      - name: Package and test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          pnpm package:e2e
          xvfb-run --auto-servernum pnpm exec playwright test

      - name: Package and test (macOS and Windows)
        if: runner.os != 'Linux'
        run: |
          pnpm package:e2e
          pnpm exec playwright test

      # Checks what was decided at package time rather than at run time: the
      # fuses, what went into the asar, and the platform's own metadata. The
      # e2e suite cannot cover these on a platform it is not running on, and
      # this is also the only check that runs against a cross packaged tree.
      - name: Verify the packaged tree
        shell: bash
        run: |
          for directory in out/e2e/Noto-*; do
            node scripts/verify-package.mjs "$directory"
          done

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: test-results
          retention-days: 7

  # Proves the release variant packages and that installers can actually be
  # produced on each platform. Unsigned here: signing secrets belong to the
  # release workflow, not to pull requests.
  installers:
    name: Installers (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: latest moved to 26.04 on
        # 2026-10-20, and its rpm 6 builds in a directory electron-installer-
        # redhat's spec does not expect (`cp -r usr/*` finds nothing), so every
        # .rpm failed. Unpin once the installer copes with rpm >= 4.20.
        os: [macos-14, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Fetch Electron's binary explicitly.
      #
      # The copy of electron that pnpm 11 installs has no `scripts` field, so
      # its `postinstall` never runs and `node_modules/electron/dist` is never
      # fetched. `pnpm ignored-builds` reports none and `pnpm rebuild electron`
      # does nothing, because from pnpm's side there is no build to run.
      # Without the binary, packaging fails on `electron/dist/LICENSE` and every
      # packaged test then fails to launch.
      - name: Ensure the Electron binary
        run: node node_modules/electron/install.js

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Build installers
        env:
          NTO_PACKAGE_VARIANT: release
        run: pnpm make:release

      # `make` packages into `out/` directly rather than into `out/release/`,
      # which is where `package:release` puts its tree. This step used to read
      # the fuses from the latter, a path this job never creates, and it only
      # printed them rather than asserting anything. The same static check the
      # e2e job runs is better on both counts, and there is no reason to run it
      # on one platform only: this is the tree that becomes the installer.
      - name: Verify the packaged release tree
        shell: bash
        run: |
          for directory in out/Noto-*; do
            node scripts/verify-package.mjs "$directory"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/make
          retention-days: 7
