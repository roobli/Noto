# Native installers for a tagged version.
#
# The archives on a release are built wherever the tag was made; these are the
# installers, and each one has to be built on the platform it installs on:
# Squirrel needs Windows, `dpkg` and `rpmbuild` need Linux. They are attached
# to the release the tag already carries rather than replacing it, so a release
# gains its installers a few minutes after it is published.
#
# Unsigned unless the signing secrets are set on the repository. What that
# means for somebody downloading is written on the release itself.
#
# A full (non-prerelease) release without signing secrets is allowed only
# while UNSIGNED_FULL_RELEASE_ALLOWED below is 'true'. Per RELEASING.md (D2,
# amended 17 October 2026), 0.0.3 ships unsigned with signing deferred; set it
# to 'false' once the Apple and Windows credentials exist, so a missing secret
# fails a full release instead of quietly shipping an unsigned one.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build installers for
        required: true

permissions:
  contents: write

env:
  UNSIGNED_FULL_RELEASE_ALLOWED: 'true'

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The release a tag belongs to, with its channel decided by the tag rather
  # than by whoever made it. A version with a prerelease component
  # (`0.0.2-alpha.113`) is a prerelease and never Latest; a plain version is a
  # full release. Stable in the app follows exactly that flag, so getting it
  # wrong once put Stable on an alpha. Latest across all releases is kept by
  # release-integrity.yml, so re-running an old tag here cannot take it.
  release:
    name: Release for the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # An unsigned full release is a decision, not an accident: it is stated
      # in the log, the job summary, and on the release page.
      - name: Decide signed or unsigned
        id: signing
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          HAS_MAC_IDENTITY: ${{ secrets.NOTO_APPLE_SIGNING_IDENTITY != '' }}
          HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE_FILE != '' }}
        shell: bash
        run: |
          if [ "$HAS_MAC_IDENTITY" = true ] && [ "$HAS_WINDOWS_CERT" = true ]; then
            echo "unsigned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "unsigned=true" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease $TAG: unsigned (macOS ad-hoc, Windows unsigned)" ;;
            *)
              if [ "$UNSIGNED_FULL_RELEASE_ALLOWED" != true ]; then
                echo "::error::$TAG is a full release but the signing secrets are missing, and UNSIGNED_FULL_RELEASE_ALLOWED is not 'true'. See RELEASING.md."
                exit 1
              fi
              echo "::warning::$TAG is an UNSIGNED full release (macOS ad-hoc signed, not notarized; Windows unsigned). Allowed by UNSIGNED_FULL_RELEASE_ALLOWED per RELEASING.md D2."
              echo "**$TAG ships unsigned** (allowed by \`UNSIGNED_FULL_RELEASE_ALLOWED\`, RELEASING.md D2)." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # The changelog section for the version, then, while builds are unsigned,
      # the first-open steps from docs/install.md.
      - name: Write the release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          UNSIGNED: ${{ steps.signing.outputs.unsigned }}
        shell: bash
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          # The changelog links to files by their path in the repository, which
          # a release page cannot follow. Point each one at the file as it is
          # at this tag. Links with a scheme, anchors and absolute paths stay.
          perl -pi -e 's{\]\((?![A-Za-z][A-Za-z0-9+.-]*:|#|/)([^)\s]+)\)}{](https://github.com/$ENV{GITHUB_REPOSITORY}/blob/$ENV{TAG}/$1)}g' notes.md
          if [ "$UNSIGNED" = true ] && ! grep -qi "first open" notes.md; then
            { echo; awk '/^```markdown$/ { on = 1; next } on && /^```$/ { exit } on { print }' docs/install.md; } >> notes.md
          fi
          cat notes.md

      - name: Create or correct the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          case "$TAG" in
            *-*) flags=(--prerelease --latest=false) ;;
            *)   flags=(--prerelease=false) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
            echo "corrected $TAG: ${flags[*]}"
          else
            if [ -s notes.md ]; then
              notes=(--notes-file notes.md)
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" "${notes[@]}" "${flags[@]}"
            echo "created $TAG: ${flags[*]}"
          fi

  installers:
    name: Installers (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple silicon. The Intel zip is cross-built on the same
        # runner and renamed to Noto-<version>-macos-x64.zip below, so both
        # architectures ship from one job (D8).
        # ubuntu-24.04, not ubuntu-latest: latest moved to 26.04 on
        # 2026-10-20, and its rpm 6 builds in a directory electron-installer-
        # redhat's spec does not expect (`cp -r usr/*` finds nothing), so every
        # .rpm failed. Unpin once the installer copes with rpm >= 4.20.
        os: [macos-14, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # The copy of electron pnpm installs has no `scripts` field, so its
      # postinstall never runs and the binary is never fetched.
      - name: Ensure the Electron binary
        run: node node_modules/electron/install.js

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      # Signing and notarization on macOS, when the secrets exist. Without them
      # every step below is a no-op and the build is ad-hoc signed, as before.
      # The Developer ID certificate goes into a throwaway keychain for this
      # job only; the App Store Connect API key is written to a file that
      # forge.config.ts hands to notarytool.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          if [ -n "$APPLE_CERTIFICATE_P12" ]; then
            keychain="$RUNNER_TEMP/noto-signing.keychain-db"
            keychain_password=$(uuidgen)
            echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
            security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/certificate.p12"
            echo "signing certificate imported"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "notarization key written"
          fi

      - name: Build installers
        env:
          NTO_PACKAGE_VARIANT: release
          NOTO_APPLE_SIGNING_IDENTITY: ${{ secrets.NOTO_APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm make:release

      # A signed build must pass the same checks Gatekeeper makes on a
      # downloaded copy: a valid signature, an accepted notarization, and a
      # stapled ticket. An unsigned build skips this, since it can pass none.
      - name: Verify signing and notarization
        if: runner.os == 'macOS'
        env:
          NOTO_APPLE_SIGNING_IDENTITY: ${{ secrets.NOTO_APPLE_SIGNING_IDENTITY }}
        shell: bash
        run: |
          if [ -z "$NOTO_APPLE_SIGNING_IDENTITY" ]; then
            echo "unsigned build: ad-hoc signature only, notarization skipped"
            exit 0
          fi
          for app in out/Noto-darwin-*/Noto.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done

      # The same static check CI runs: the fuses, the asar, and the platform's
      # own metadata, read from the tree that became the installer.
      - name: Verify the packaged release tree
        shell: bash
        run: |
          for directory in out/Noto-*; do
            node scripts/verify-package.mjs "$directory"
          done

      # Named the way the release page names things: the product, the version,
      # the platform and the architecture. Forge names its zip after the
      # platform triple and its installers after the product, so left alone a
      # release page would carry three naming schemes.
      - name: Name the artifacts for a release page
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p upload
          # Installers people download, plus Squirrel's update feed (RELEASES +
          # nupkg) and electron-updater yml metadata so packaged apps can
          # auto-update from this release. See docs/architecture/updates.md.
          find out/make -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.nupkg' -o -name 'RELEASES' \) -print0 |
            while IFS= read -r -d '' file; do
              base=$(basename "$file")
              case "$base" in
                Noto-darwin-arm64-*.zip) name="Noto-$version-macos-arm64.zip" ;;
                Noto-darwin-x64-*.zip) name="Noto-$version-macos-x64.zip" ;;
                RELEASES) name="RELEASES" ;;
                *"$version"*) name="$base" ;;
                *) name="${base%.*}-$version.${base##*.}" ;;
              esac
              cp "$file" "upload/$name"
            done
          node scripts/write-update-metadata.mjs upload
          ls -l upload

      # One at a time, and never over something already there. The archives on
      # a release may have been built where the tag was made; replacing one
      # would leave the checksums beside it describing a file that is no longer
      # the file, which is worse than a duplicate.
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          for file in upload/*; do
            if gh release upload "$TAG" "$file"; then
              echo "attached $(basename "$file")"
            else
              echo "left the one already there: $(basename "$file")"
            fi
          done
