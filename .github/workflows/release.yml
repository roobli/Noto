# Native installers for a tagged version.
#
# The archives on a release are built wherever the tag was made; these are the
# installers, and each one has to be built on the platform it installs on:
# Squirrel needs Windows, `dpkg` and `rpmbuild` need Linux. They are attached
# to the release the tag already carries rather than replacing it, so a release
# gains its installers a few minutes after it is published.
#
# Unsigned unless the signing secrets are set on the repository. What that
# means for somebody downloading is written on the release itself.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build installers for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # The release a tag belongs to, with its channel decided by the tag rather
  # than by whoever made it. A version with a prerelease component
  # (`0.0.2-alpha.113`) is a prerelease and never Latest; a plain version is a
  # full release. Stable in the app follows exactly that flag, so getting it
  # wrong once put Stable on an alpha. Latest across all releases is kept by
  # release-integrity.yml, so re-running an old tag here cannot take it.
  release:
    name: Release for the tag
    runs-on: ubuntu-latest
    steps:
      - name: Create or correct the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          case "$TAG" in
            *-*) flags=(--prerelease --latest=false) ;;
            *)   flags=(--prerelease=false) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
            echo "corrected $TAG: ${flags[*]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
            echo "created $TAG: ${flags[*]}"
          fi

  installers:
    name: Installers (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple silicon. macos-13 (Intel) runners are scarce and
        # leave Release jobs queued for hours, so only arm64 ships. That leaves
        # Intel Macs without a build: Rosetta runs Intel code on Apple silicon,
        # not the other way round. A universal or cross-built x64 package is
        # the open question (decision D8 on the docs site).
        os: [macos-14, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # The copy of electron pnpm installs has no `scripts` field, so its
      # postinstall never runs and the binary is never fetched.
      - name: Ensure the Electron binary
        run: node node_modules/electron/install.js

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Build installers
        env:
          NTO_PACKAGE_VARIANT: release
          NOTO_APPLE_SIGNING_IDENTITY: ${{ secrets.NOTO_APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm make:release

      # The same static check CI runs: the fuses, the asar, and the platform's
      # own metadata, read from the tree that became the installer.
      - name: Verify the packaged release tree
        shell: bash
        run: |
          for directory in out/Noto-*; do
            node scripts/verify-package.mjs "$directory"
          done

      # Named the way the release page names things: the product, the version,
      # the platform and the architecture. Forge names its zip after the
      # platform triple and its installers after the product, so left alone a
      # release page would carry three naming schemes.
      - name: Name the artifacts for a release page
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p upload
          # Installers people download, plus Squirrel's update feed (RELEASES +
          # nupkg) and electron-updater yml metadata so packaged apps can
          # auto-update from this release. See docs/architecture/updates.md.
          find out/make -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.nupkg' -o -name 'RELEASES' \) -print0 |
            while IFS= read -r -d '' file; do
              base=$(basename "$file")
              case "$base" in
                Noto-darwin-arm64-*.zip) name="Noto-$version-macos-arm64.zip" ;;
                Noto-darwin-x64-*.zip) name="Noto-$version-macos-x64.zip" ;;
                RELEASES) name="RELEASES" ;;
                *"$version"*) name="$base" ;;
                *) name="${base%.*}-$version.${base##*.}" ;;
              esac
              cp "$file" "upload/$name"
            done
          node scripts/write-update-metadata.mjs upload
          ls -l upload

      # One at a time, and never over something already there. The archives on
      # a release may have been built where the tag was made; replacing one
      # would leave the checksums beside it describing a file that is no longer
      # the file, which is worse than a duplicate.
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          for file in upload/*; do
            if gh release upload "$TAG" "$file"; then
              echo "attached $(basename "$file")"
            else
              echo "left the one already there: $(basename "$file")"
            fi
          done
