<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFBF8"/>
      <stop offset="1" stop-color="#F1EDE6"/>
    </linearGradient>
    <linearGradient id="caret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8693F"/>
      <stop offset="1" stop-color="#9C5233"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#34312E" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- The tile: the macOS grid, 824 square with its continuous corner, a little shadow under it. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)" filter="url(#lift)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#34312E" stroke-opacity="0.08"/>
  <!-- N: a thin stem, a heavy diagonal, and for its last stroke the caret, still being written. -->
  <g transform="translate(-8 0)">
    <rect x="318" y="324" width="62" height="378" rx="6" fill="#34312E"/>
    <path d="M318 324 H422 L650 702 H546 Z" fill="#34312E"/>
    <rect x="680" y="290" width="46" height="446" rx="23" fill="url(#caret)"/>
  </g>
</svg>
