packages:
  - .

# Forge 7.11.2 resolves its reviewed Electron node-gyp fork by immutable Git
# commit. pnpm 11 blocks that transitive source unless this is explicit.
blockExoticSubdeps: false
nodeLinker: hoisted
# Forge 7.11.2 still declares @electron/fuses ^1, while the approved API map
# pins 2.1.3. Packaging and fuse inspection are the executable compatibility
# gate, so resolution preserves both exact versions instead of substituting.
strictPeerDependencies: false

allowBuilds:
  '@roobli/md': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/7f21f1961d835a832962dcea3ab7dde85d5c9e41': true
  '@parcel/watcher': true
  electron: true
  esbuild: true
  '@electron/node-gyp@git+https://github.com/electron/node-gyp.git': true
  # Unpacks the Squirrel binaries used to build the Windows installer. Runs
  # only while packaging, never inside the app.
  electron-winstaller: true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/432f2d6a34a55d141e3671efd966686f2bda5f0f': set this to true or false
