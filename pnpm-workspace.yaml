packages:
  - .

# Forge 7.11.2 resolves its reviewed Electron node-gyp fork by immutable Git
# commit. pnpm 11 blocks that transitive source unless this is explicit.
blockExoticSubdeps: false
nodeLinker: hoisted
# Forge 7.11.2 still declares @electron/fuses ^1, while the approved API map
# pins 2.1.3. Packaging and fuse inspection are the executable compatibility
# gate, so resolution preserves both exact versions instead of substituting.
strictPeerDependencies: false

allowBuilds:
  '@roobli/md': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/411335986ebf52c45bdafb230916d939a536b36b': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/13e17b7d1b6e6286d2c483358777d55a50b0cecf': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/dda6988f51a997a0591d88808a553e8d272033c2': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/24640d1f72664830fe3d4c23ab02acd76847c7d2': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/a2f11a246662053633cc58c9e7c701b9169a0ade': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/30c9264da78b712db2d20dfae40692b36d40c3d6': true
  '@roobli/md@https://codeload.github.com/roobli/md/tar.gz/680f0dd5513bc924515b623ad40e50fd463930f9': true
  '@parcel/watcher': true
  electron: true
  esbuild: true
  '@electron/node-gyp@git+https://github.com/electron/node-gyp.git': true
  # Unpacks the Squirrel binaries used to build the Windows installer. Runs
  # only while packaging, never inside the app.
  electron-winstaller: true
